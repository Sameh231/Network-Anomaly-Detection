# Network Anomaly Detection - Free Deployment
# Backend API only (Frontend runs locally)

services:
  - type: web
    name: network-anomaly-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: FLASK_ENV
        value: production
